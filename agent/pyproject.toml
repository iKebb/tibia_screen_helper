[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tibia-agent"
version = "0.1.0"
description = "Experimental AI agent that plays Tibia (OpenTibia) autonomously."
requires-python = ">=3.10"
dependencies = [
    "websockets>=13",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
vision = [
    "mss>=9",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pynput>=1.7",
    "pygame>=2.5",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "lupa>=2"]

[project.scripts]
tibia-agent = "tibia_agent.main:main"
tibia-mock = "tibia_agent.mock_game:main"
tibia-calibrate = "tibia_agent.vision.calibrate:main"
tibia-vision-mock = "tibia_agent.vision.mock_screen:main"

[tool.setuptools.packages.find]
include = ["tibia_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
